# ~/lab2-2024E8021682118/kas.yml
header:
  version: 14

machine: qemuriscv64
distro: openembedded

repos:
  layers:
    # 自定义层（存放实验代码）
    - name: meta-2024E8021682118
      path: meta-2024E8021682118

    # 基础层
    - name: openembedded-core
      url: https://git.openembedded.org/openembedded-core
      refspec: master
      layers:
        - meta

    # 扩展功能层
    - name: meta-openembedded
      url: https://git.openembedded.org/meta-openembedded
      refspec: master
      layers:
        - meta-oe
        - meta-python

    # RISC-V 支持层
    - name: meta-riscv
      url: https://git.yoctoproject.org/meta-riscv
      refspec: master

local_conf_header: |
  # 设置代理（按需）
  # export http_proxy="http://your-proxy:port"
  
  # 设置 QEMU 内存
  QB_MEM = "-m 4096"